<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurações | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar border-bottom">
        <div class="container"><a class="navbar-brand titulo" href="dashboard.html">organiza<span>+</span></a><a
                class="link-escuro" href="perfil.html">Perfil</a></div>
    </nav>
    <main class="container py-5">
        <p class="pequeno text-uppercase">Ajuste o Organiza+ ao seu ritmo</p>
        <h1 class="titulo display-6 mb-5">Preferências</h1>
        <div class="row">
            <div class="col-12 col-lg-7">
                <h2 class="h4 titulo">Avisos e lembretes</h2>
                <div class="form-check form-switch border-bottom py-3"><input class="form-check-input" type="checkbox"
                        id="prazo" checked><label class="form-check-label" for="prazo">Lembrar dos prazos<br><small
                            class="text-secondary">Receba um lembrete antes de uma tarefa vencer.</small></label>
                </div>
                <div class="form-check form-switch border-bottom py-3"><input class="form-check-input" type="checkbox"
                        id="resumo" checked><label class="form-check-label" for="resumo">Resumo do dia<br><small
                            class="text-secondary">Receba um resumo das tarefas concluídas e pendentes.</small></label>
                </div>
                <h2 class="h4 titulo mt-5">Acesso à conta</h2><a class="btn btn-outline-danger" href="logout.html">Sair
                    da conta</a>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
