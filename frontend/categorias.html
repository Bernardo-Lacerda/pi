<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listas | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar border-bottom">
        <div class="container"><a class="navbar-brand titulo" href="dashboard.html">organiza<span>+</span></a><a
                class="btn btn-sm btn-dark" href="tarefas.html">Ver tarefas</a></div>
    </nav>
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-5">
            <div>
                <p class="pequeno text-uppercase">Cada assunto no seu lugar</p>
                <h1 class="titulo display-6 mb-0">Minhas listas</h1>
            </div><button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#modal-lista">Criar lista</button>
        </div>
        <div class="row g-4">
            <div class="col-md-6 col-lg-3">
                <div class="border-top pt-3">
                    <h2 class="h4 titulo">Estudos</h2>
                    <p class="text-secondary">8 tarefas nesta lista</p>
                    <div class="progress" role="progressbar" aria-label="Progresso de Estudos" aria-valuenow="75"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar bg-success" style="width: 75%"></div>
                    </div><small class="text-secondary">6 de 8 concluídas</small>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="border-top pt-3">
                    <h2 class="h4 titulo">Trabalho</h2>
                    <p class="text-secondary">5 tarefas</p>
                    <div class="progress" role="progressbar" aria-label="Progresso de Trabalho" aria-valuenow="40"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar bg-warning" style="width: 40%"></div>
                    </div><small class="text-secondary">2 de 5 concluídas</small>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="border-top pt-3">
                    <h2 class="h4 titulo">Pessoal</h2>
                    <p class="text-secondary">4 tarefas</p>
                    <div class="progress" role="progressbar" aria-label="Progresso Pessoal" aria-valuenow="50"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar bg-info" style="width: 50%"></div>
                    </div><small class="text-secondary">2 de 4 concluídas</small>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="border-top pt-3">
                    <h2 class="h4 titulo">Projetos</h2>
                    <p class="text-secondary">7 tarefas</p>
                    <div class="progress" role="progressbar" aria-label="Progresso de Projetos" aria-valuenow="29"
                        aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" style="width: 29%"></div>
                    </div><small class="text-secondary">2 de 7 concluídas</small>
                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="modal-lista" tabindex="-1" aria-labelledby="titulo-modal-lista" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5 titulo" id="titulo-modal-lista">Criar uma nova lista</h2><button
                        type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body"><label class="form-label" for="nome-lista">Nome da lista</label><input
                        class="form-control" id="nome-lista" name="nome" placeholder="Ex.: Casa, faculdade ou projeto">
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-dark" data-bs-dismiss="modal">Criar
                        lista</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
