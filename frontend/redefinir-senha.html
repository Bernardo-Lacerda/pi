<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redefinir senha | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5"><a class="navbar-brand titulo" href="index.html">organiza<span>+</span></a>
        <div class="row justify-content-center py-5">
            <div class="col-md-6 col-lg-4">
                <p class="pequeno text-uppercase">Último passo</p>
                <h1 class="titulo mb-4">Escolha uma nova senha</h1>
                <form action="login.html"><label class="form-label" for="senha">Nova senha</label><input
                        class="form-control mb-3" id="senha" type="password" required><label class="form-label"
                        for="confirmar">Digite a senha novamente</label><input class="form-control mb-4" id="confirmar"
                        type="password" required><button class="btn btn-dark w-100" type="submit">Definir nova
                        senha</button></form>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
