<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar tarefa | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5"><a class="navbar-brand titulo" href="dashboard.html">organiza<span>+</span></a>
        <div class="row justify-content-center py-5">
            <div class="col-lg-7">
                <p class="pequeno text-uppercase">Atualize o que mudou</p>
                <h1 class="titulo mb-4">Editar tarefa</h1>
                <form action="tarefa-visualizar.html"><label class="form-label" for="titulo-tarefa">Título</label><input
                        class="form-control mb-3" id="titulo-tarefa" value="Finalizar o relatório mensal"><label
                        class="form-label" for="descricao">Como essa tarefa deve ser feita?</label><textarea
                        class="form-control mb-3" id="descricao"
                        rows="4">Revisar os dados e enviar para o time.</textarea>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4"><label class="form-label" for="lista">Lista</label><select
                                class="form-select" id="lista">
                                <option>Trabalho</option>
                            </select></div>
                        <div class="col-md-4"><label class="form-label" for="prioridade">Prioridade</label><select
                                class="form-select" id="prioridade">
                                <option>Alta</option>
                                <option>Média</option>
                                <option>Baixa</option>
                            </select></div>
                        <div class="col-md-4"><label class="form-label" for="status">Status</label><select
                                class="form-select" id="status">
                                <option>Pendente</option>
                                <option>Em andamento</option>
                                <option>Concluída</option>
                            </select></div>
                    </div><button class="btn btn-dark" type="submit">Salvar mudanças</button> <a
                        class="btn btn-link link-escuro" href="tarefa-visualizar.html">Descartar mudanças</a>
                </form>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
