<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administração | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5"><a class="navbar-brand titulo" href="dashboard.html">organiza<span>+</span></a>
        <div class="d-flex justify-content-between align-items-end mt-5 mb-4">
            <div>
                <p class="pequeno text-uppercase">Acompanhe a operação</p>
                <h1 class="titulo display-6 mb-0">Painel administrativo</h1>
            </div><span class="badge text-bg-success">Operação normal</span>
        </div>
        <div class="row g-3 mb-5">
            <div class="col-md-3">
                <div class="border-top pt-3"><span class="pequeno">USUÁRIOS</span>
                    <div class="h2 titulo">1.248</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="border-top pt-3"><span class="pequeno">USUÁRIOS ATIVOS</span>
                    <div class="h2 titulo">842</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="border-top pt-3"><span class="pequeno">TAREFAS</span>
                    <div class="h2 titulo">3.721</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="border-top pt-3"><span class="pequeno">CONCLUÍDAS</span>
                    <div class="h2 titulo">2.918</div>
                </div>
            </div>
        </div><label class="form-label visually-hidden" for="busca-usuario">Buscar usuário</label><input
            id="busca-usuario" name="busca" class="form-control mb-3" placeholder="Buscar por nome ou email">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Email</th>
                        <th scope="col">Status</th>
                        <th scope="col">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Marina Costa</td>
                        <td>marina.costa@email.com</td>
                        <td><span class="badge text-bg-success">Conta ativa</span></td>
                        <td><button type="button" class="btn btn-sm btn-outline-dark">Visualizar</button></td>
                    </tr>
                    <tr>
                        <td>Rafael Mendes</td>
                        <td>rafael.mendes@email.com</td>
                        <td><span class="badge text-bg-success">Conta ativa</span></td>
                        <td><button type="button" class="btn btn-sm btn-outline-dark">Visualizar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
