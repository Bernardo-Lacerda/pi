<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visualizar tarefa | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5"><a class="navbar-brand titulo" href="dashboard.html">organiza<span>+</span></a>
        <div class="row justify-content-center py-5">
            <div class="col-lg-8" id="conteudo-tarefa">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div>
                        <p class="pequeno text-uppercase" id="meta-tarefa">Carregando...</p>
                        <h1 class="titulo display-6" id="titulo-tarefa"></h1>
                    </div><span class="badge text-bg-warning" id="badge-prioridade"></span>
                </div>
                <p class="lead mt-4" id="descricao-tarefa"></p>
                <hr class="my-5">
                <div class="d-flex flex-wrap gap-2"><a class="btn btn-dark" id="link-editar" href="#">Editar
                        tarefa</a><button type="button" class="btn btn-outline-dark" id="btn-alternar-status"></button><a
                        class="btn btn-outline-dark" href="tarefas.html">Voltar para minhas
                        tarefas</a><button type="button" class="btn btn-outline-danger" id="btn-excluir">Excluir</button>
                </div>
                <p class="mt-3 text-danger" id="mensagem-tarefa"></p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/comum.js"></script>
    <script src="assets/js/paginas/tarefa-visualizar.js"></script>
</body>

</html>
