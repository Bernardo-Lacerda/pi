<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendário | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar border-bottom">
        <div class="container"><a class="navbar-brand titulo" href="dashboard.html">organiza<span>+</span></a><a
                class="link-escuro" href="tarefas.html">Tarefas</a></div>
    </nav>
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <p class="pequeno text-uppercase">Veja seus prazos de relance</p>
                <h1 class="titulo display-6 mb-0" id="titulo-calendario">Calendário</h1>
            </div>
            <div class="btn-group flex-wrap"><button class="btn btn-outline-dark" type="button" id="btn-mes-anterior"
                    aria-label="Mês anterior">&#8592;</button><button class="btn btn-outline-dark" id="btn-mes-hoje"
                    type="button">Hoje</button><button class="btn btn-outline-dark" type="button" id="btn-mes-proximo"
                    aria-label="Próximo mês">&#8594;</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center">
                <thead>
                    <tr>
                        <th scope="col">Dom</th>
                        <th scope="col">Seg</th>
                        <th scope="col">Ter</th>
                        <th scope="col">Qua</th>
                        <th scope="col">Qui</th>
                        <th scope="col">Sex</th>
                        <th scope="col">Sáb</th>
                    </tr>
                </thead>
                <tbody id="corpo-calendario"></tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/comum.js"></script>
    <script src="assets/js/paginas/calendario.js"></script>
</body>

</html>
