<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar border-bottom">
        <div class="container"><a class="navbar-brand titulo" href="dashboard.html">organiza<span>+</span></a><a
                class="link-escuro" href="configuracoes.html">Configurações</a></div>
    </nav>
    <main class="container py-5">
        <p class="pequeno text-uppercase">Seus dados</p>
        <h1 class="titulo display-6 mb-5">Meu perfil</h1>
        <div class="row g-5">
            <div class="col-lg-4">
                <div class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center"
                    style="width: 96px; height: 96px; font-size: 2rem;">MC</div>
                <h2 class="h4 titulo mt-3">Marina Costa</h2>
                <p class="text-secondary">marina.costa@email.com</p>
            </div>
            <div class="col-lg-6">
                <form><label class="form-label" for="nome">Como você quer ser chamado?</label><input
                        class="form-control mb-3" id="nome" value="Marina Costa"><label class="form-label"
                        for="email">Email</label><input class="form-control mb-4" id="email"
                        value="marina.costa@email.com"><button class="btn btn-dark" type="button"
                        data-confirmar="Suas informações foram atualizadas.">Salvar mudanças</button></form>
                <hr class="my-5"><a class="link-danger" href="logout.html">Sair do Organiza+</a>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
