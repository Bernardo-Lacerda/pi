<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5"><a class="navbar-brand titulo" href="index.html">organiza<span>+</span></a>
        <div class="row justify-content-center py-5">
            <div class="col-md-6 col-lg-4">
                <p class="pequeno text-uppercase">Que bom ter você por aqui</p>
                <h1 class="titulo mb-4">Continue de onde parou</h1>
                <form id="form-login" action="dashboard.html"><label class="form-label" for="email">Email</label><input
                        class="form-control mb-3" id="email" type="email" placeholder="voce@email.com" required><label
                        class="form-label" for="senha">Senha</label><input class="form-control mb-2" id="senha"
                        type="password" placeholder="Sua senha" required><a class="small link-escuro"
                        href="recuperar-senha.html">Não lembro minha senha</a><button class="btn btn-dark w-100 mt-4"
                        type="submit">Entrar</button></form>
                <p class="mt-4 text-secondary">Primeira vez por aqui? <a class="link-escuro" href="cadastro.html">Crie
                        sua conta</a></p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/comum.js"></script>
    <script src="assets/js/paginas/login.js"></script>
</body>

</html>
