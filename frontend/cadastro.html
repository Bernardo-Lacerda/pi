<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5"><a class="navbar-brand titulo" href="index.html">organiza<span>+</span></a>
        <div class="row justify-content-center py-5">
            <div class="col-md-7 col-lg-5">
                <p class="pequeno text-uppercase">Vamos deixar sua rotina mais clara</p>
                <h1 class="titulo mb-4">Comece a organizar seu dia</h1>
                <form action="dashboard.html"><label class="form-label" for="nome">Nome</label><input
                        class="form-control mb-3" id="nome" placeholder="Digite seu nome" required><label
                        class="form-label" for="email">Email</label><input class="form-control mb-3" id="email"
                        type="email" placeholder="voce@email.com" required><label class="form-label"
                        for="senha">Senha</label><input class="form-control mb-3" id="senha" type="password"
                        required><button class="btn btn-dark w-100" type="submit">Criar minha conta</button></form>
                <p class="mt-4 text-secondary">Já tem uma conta? <a class="link-escuro" href="login.html">Entre por
                        aqui</a></p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
