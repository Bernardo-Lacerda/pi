<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarefas | Organiza+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar border-bottom">
        <div class="container"><a class="navbar-brand titulo" href="dashboard.html">organiza<span>+</span></a>
            <div class="d-flex gap-3"><a class="link-escuro" href="categorias.html">Listas</a><a class="link-escuro"
                    href="calendario.html">Calendário</a><a class="btn btn-sm btn-dark" href="tarefa-criar.html">Nova
                    tarefa</a></div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <p class="pequeno text-uppercase">Tudo o que está na sua lista</p>
                <h1 class="titulo display-6 mb-0">Minhas tarefas</h1>
            </div><a class="link-escuro" href="tarefas-concluidas.html">Ver tarefas concluídas</a>
        </div>
        <div class="row g-2 mb-4">
            <div class="col-md-4"><label class="form-label visually-hidden" for="filtro-status">Filtrar por
                    status</label><select class="form-select" id="filtro-status" name="status">
                    <option value="">Filtrar por status</option>
                    <option value="pendente">Pendente</option>
                    <option value="em_progresso">Em andamento</option>
                    <option value="concluida">Concluída</option>
                </select></div>
            <div class="col-md-4"><label class="form-label visually-hidden" for="filtro-lista">Filtrar por
                    lista</label><select class="form-select" id="filtro-lista" name="lista">
                    <option value="">Filtrar por lista</option>
                </select></div>
            <div class="col-md-4"><label class="form-label visually-hidden" for="filtro-prioridade">Filtrar por
                    prioridade</label><select class="form-select" id="filtro-prioridade" name="prioridade">
                    <option value="">Filtrar por prioridade</option>
                    <option value="alta">Alta</option>
                    <option value="media">Média</option>
                    <option value="baixa">Baixa</option>
                </select></div>
        </div>
        <div class="list-group" id="lista-tarefas"></div>
    </main>
    <script src="script.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/comum.js"></script>
    <script src="assets/js/paginas/tarefas.js"></script>
</body>

</html>
